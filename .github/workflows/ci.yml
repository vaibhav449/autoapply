name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector/pgvector, not plain postgres:16-alpine — matches docker-compose.yml.
        # The vector extension binary isn't in the stock image; CREATE EXTENSION fails without it.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: autoapply
          POSTGRES_PASSWORD: autoapply
          POSTGRES_DB: autoapply_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Install Playwright browsers
        # pip installs the playwright package but never the browser binaries.
        # The ATS adapter tests drive a real Chromium against a captured page
        # snapshot, so without this they fail with "Executable doesn't exist".
        # Chromium only - it is the single browser the adapter launches.
        working-directory: backend
        run: playwright install --with-deps chromium
      - name: Lint
        working-directory: backend
        run: ruff check .
      - name: Test
        working-directory: backend
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Build
        working-directory: frontend
        run: npm run build
